monolit.vk.long-poll.enabled=true

server.address=127.0.0.1
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

monolit.news.zone=Europe/Moscow
monolit.news.cherinfo.enabled=false

monolit.news.cherinfo.rss-url=https://cherinfo.ru/rss/news/
monolit.news.cherinfo.cron=0 0 * * * *

#spring.datasource.url=jdbc:postgresql://192.168.0.16:5432/home_db
spring.datasource.url=jdbc:postgresql://localhost/postgres
spring.datasource.username=postgres
spring.datasource.password=system
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# HikariCP
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=60000

# Lazy Initialization
spring.main.lazy-initialization=true
