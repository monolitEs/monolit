name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: monolit-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, ci]
    timeout-minutes: 30
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_SHA: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: monolit
      DOCKER_HOST: unix:///var/run/docker.sock
      POSTGRES_NETWORK: ${{ vars.POSTGRES_NETWORK || 'infra-db' }}
      VK_GROUP_ID: ${{ vars.VK_GROUP_ID }}
      VK_MY_ID: ${{ vars.VK_MY_ID }}
      MONOLIT_CHAT_ENABLED: ${{ vars.MONOLIT_CHAT_ENABLED || 'true' }}

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create missing database and role
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
        run: bash .github/scripts/deploy.sh prepare

      - name: Check database connection
        env: &runtime-env
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
        run: bash .github/scripts/deploy.sh check-database

      - name: Build image
        env: *runtime-env
        run: bash .github/scripts/deploy.sh build

      - name: Deploy application
        env: *runtime-env
        run: bash .github/scripts/deploy.sh deploy
