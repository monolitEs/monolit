name: Java CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    container:
      image: maven:3.9.16-eclipse-temurin-21

    defaults:
      run:
        shell: bash

    env:
      MAVEN_OPTS: -Dmaven.repo.local=/tmp/m2
      SONAR_USER_HOME: /tmp/sonar

    steps:  
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Trust workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and tests
        run: mvn --batch-mode --no-transfer-progress -Dmaven.test.failure.ignore=true clean verify

      - name: SonarQube Cloud analysis and Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          : "${SONAR_TOKEN:?Set GitHub secret SONAR_TOKEN; fork PR analysis is unavailable}"
          : "${SONAR_ORGANIZATION:?Set GitHub variable SONAR_ORGANIZATION}"
          : "${SONAR_PROJECT_KEY:?Set GitHub variable SONAR_PROJECT_KEY}"
          mvn --batch-mode --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            "-Dsonar.organization=$SONAR_ORGANIZATION" \
            "-Dsonar.projectKey=$SONAR_PROJECT_KEY" \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.scanner.skipJreProvisioning=true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: warn
          path: |
            target/site/jacoco/
            target/surefire-reports/

      - name: Clean build output
        if: always()
        run: |
          set -euo pipefail
          : "${GITHUB_WORKSPACE:?Missing runner workspace}"
          test "$GITHUB_WORKSPACE" != /
          rm -rf -- "$GITHUB_WORKSPACE/target"
